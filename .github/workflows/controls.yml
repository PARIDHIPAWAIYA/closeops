name: controls

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e '.[test,trace,dodo]'

      - name: Tests
        run: pytest -q

      - name: Controls
        id: controls
        continue-on-error: true
        run: |
          closeops check --json | tee controls.json
          exit "${PIPESTATUS[0]}"

      - name: Report
        run: closeops report

      - name: PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file close-report.md

      - name: Detect real close entries on main
        id: ledger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gate=false
          if ls ledger/2026-09/*.beancount >/dev/null 2>&1; then
            if grep -rEq '^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+(\*|!|txn)' ledger/2026-09/*.beancount; then
              gate=true
            fi
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Fail if controls failed
        if: >-
          steps.controls.outcome == 'failure' && (
            startsWith(github.head_ref, 'close/') ||
            startsWith(github.event.pull_request.title, 'close(') ||
            steps.ledger.outputs.gate == 'true'
          )
        run: |
          echo "One or more controls failed."
          exit 1
